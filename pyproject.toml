[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["astroquant*"]

[project]
name = "astroquant"
version = "0.1.0"
description = "Quantitative astro-trading signal engine (Hitt/Weingarten methods)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyswisseph>=2.10",
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["astroquant/tests"]
